<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refill Shampoo Store Locator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 35%;
      background-color: #fff;
      padding: 40px;
      box-sizing: border-box;
      color: #1e3932;
    }
    .map {
      width: 65%;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      border: 2px solid #00754a;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab.active {
      background-color: #00754a;
      color: white;
    }
    .search-bar {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px;
      border: none;
      border-bottom: 2px solid #ccc;
      font-size: 16px;
    }
    .filter-btn {
      margin-left: 10px;
      padding: 10px 20px;
      border: 2px solid #00754a;
      border-radius: 25px;
      background-color: white;
      color: #00754a;
      cursor: pointer;
      font-weight: bold;
    }
    h2 {
      font-size: 28px;
      margin-top: 40px;
    }
    p {
      font-size: 16px;
      color: #555;
    }
    .links {
      margin-top: 60px;
    }
    .links a {
      display: block;
      color: #00754a;
      text-decoration: none;
      margin-bottom: 10px;
      font-weight: bold;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="tabs">
      <div class="tab active">Pickup</div>
      <div class="tab">Delivery</div>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Find a store">
      <button class="filter-btn">Filter</button>
    </div>
    <h2>Zoomed out too far</h2>
    <p>Try searching for a location or zooming in to see results.</p>
    <div class="links">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Use</a>
      <a href="#">Do Not Share My Personal Information</a>
    </div>
  </div>
  <div class="map">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m3!1d3151.835434509374!2d144.9537363153169!3d-37.81627977975195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf577c1f0b0b0b0b0!2sStarbucks!5e0!3m2!1sen!2sus!4v1660000000000"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>
</body>
</html>
