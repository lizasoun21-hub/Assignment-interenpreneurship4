<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fafafa;
    }
    .container {
      display: flex;
      background-color: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      overflow: hidden;
      width: 900px;
    }
    .left {
      flex: 1;
      text-align: center;
      padding: 40px;
    }
    .left h2 {
      font-weight: normal;
    }
    .left span {
      color: #ed4956;
      font-weight: bold;
    }
    .right {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
    }
    button {
      background-color: #0095f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .link {
      text-align: center;
      margin-top: 10px;
    }
    .link a {
      color: #0095f6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <img src="e:\pich\photo_2026-08-14_17-54-14.jpg" width="80" alt="Instagram Logo">
      <h2>See everyday moments from your <span>close friends</span>.</h2>
    </div>
    <div class="right">
      <h3>Log into Refill Shampoo station </h3>
      <input type="text" placeholder="Mobile number, username or email">
      <input type="password" placeholder="Password">
      <a href="#">Login out</a>
      <a href="#">Forgot password?</a>
      <a href="#">Create new account</a>
    </div>
  </div>
</body>
</html>
